<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo Crosswords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212;
    --muted:#6b6b6b;
    --line:#dcdcdc;
    --select:#ffda00;
    --highlight:#a7d8ff;
    --font:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px 64px}

  header.masthead{
    border-bottom:1px solid var(--ink);
    padding:36px 0 18px;margin-bottom:26px;text-align:center;
  }
  .wordmark{
    font-weight:700;font-size:clamp(22px,5.6vw,40px);
    letter-spacing:.13em;text-transform:uppercase;margin:0;
    white-space:nowrap;
  }
  .tagline{margin:10px 0 0;font-size:13px;letter-spacing:.05em;color:var(--muted)}
  .you{margin-top:16px;font-size:13px;color:var(--muted)}
  .you input{
    font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink);
    border:none;border-bottom:1px dashed var(--line);background:transparent;
    padding:2px;width:11ch;text-align:center;
  }
  .you input:focus{outline:none;border-bottom-color:var(--ink)}

  .listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  h2.section{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:0;
  }
  .add{
    font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;
    color:var(--ink);background:#fff;
    border:1px solid var(--ink);border-radius:18px;padding:8px 16px;
  }
  .add:hover{background:var(--ink);color:#fff}
  .add:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  ul.puzzles{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li.puzzle{border-bottom:1px solid var(--line)}
  a.card{
    display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
    padding:18px 4px;text-decoration:none;color:inherit;
  }
  a.card:hover .title{text-decoration:underline}
  a.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .thumb{display:grid;gap:1px;background:#000;border:1px solid #000;width:52px;height:52px}
  .thumb i{background:#fff}
  .thumb i.b{background:#000}

  .title{font-weight:600;font-size:18px;margin:0 0 3px;display:block}
  .meta{font-size:13px;color:var(--muted);display:block}
  .status{text-align:right;font-size:12px;color:var(--muted);min-width:104px}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
  .bar span{display:block;height:100%;background:var(--select);width:0%}
  .solved{color:#0a7d33;font-weight:600}
  .live{display:inline-flex;align-items:center;gap:5px;color:#1a6ec4;font-weight:600}
  .dot{width:6px;height:6px;border-radius:50%;background:#1a6ec4;display:inline-block}

  .empty{
    border:1px dashed var(--line);border-radius:8px;
    padding:34px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;
  }
  .empty a.cta{
    display:inline-block;margin-top:14px;background:var(--ink);color:#fff;
    text-decoration:none;font-weight:600;font-size:14px;padding:10px 20px;border-radius:20px;
  }
  .note{
    margin-top:28px;font-size:13px;line-height:1.55;color:var(--muted);
    border-left:3px solid var(--highlight);padding-left:14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="wordmark">Duo Crosswords</h1>
    <p class="tagline">Solve together, in real time</p>
    <p class="you">You're solving as <input id="nameInput" maxlength="16" aria-label="Your name"></p>
  </header>

  <div class="listhead">
    <h2 class="section">Puzzles</h2>
    <a class="add" href="new.html">+ New puzzle</a>
  </div>

  <div id="mount"><p class="status">Loading&hellip;</p></div>

  <p class="note">
    Pick a puzzle, then start a room or type in a friend's code. Everyone in a
    room shares one grid &mdash; letters appear as they're typed &mdash; and other
    rooms solving the same puzzle never see it.
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="crossword-core.js"></script>
<script>
/* ------------------------------------------------------------------
   Every page here needs its sibling files. If one didn't load — wrong
   folder, renamed, or a stale browser cache — say so plainly instead of
   failing later with "X is not defined".
------------------------------------------------------------------ */
(function checkFiles() {
  const missing = [];
  if (typeof firebase === "undefined") missing.push("the Firebase SDK (from gstatic.com — offline?)");
  if (typeof db === "undefined" || typeof ROOT === "undefined") missing.push("firebase-config.js");
  if (typeof gridProblem === "undefined" || typeof buildModel === "undefined") missing.push("crossword-core.js");
  if (!missing.length) return;
  document.body.innerHTML =
    `<div style="font-family:'Libre Franklin',Helvetica,Arial,sans-serif;max-width:560px;
                 margin:70px auto;padding:0 22px;color:#121212;line-height:1.6">
       <h1 style="font-size:20px;margin:0 0 12px">Some files didn't load</h1>
       <p style="margin:0 0 14px">This page couldn't find: <b>${missing.join("</b>, <b>")}</b></p>
       <p style="margin:0 0 14px;color:#6b6b6b;font-size:14px">
         Every file has to sit in the same folder, spelled exactly:
         <code>index.html</code>, <code>rooms.html</code>, <code>puzzle.html</code>,
         <code>new.html</code>, <code>add-puzzles.html</code>, <code>add-puzzles.js</code>,
         <code>crossword-core.js</code>, <code>firebase-config.js</code>.
         Watch for a stray <code>.txt</code> on the end from downloading, and try a
         hard refresh (Cmd-Shift-R) in case an old copy is cached.
       </p>
       <p style="margin:0;font-size:14px"><a href="index.html" style="color:#121212">Back to puzzles</a></p>
     </div>`;
  throw new Error("Missing: " + missing.join(", "));
})();

const me = loadSolver();

const nameInput = document.getElementById("nameInput");
nameInput.value = me.name;
nameInput.addEventListener("change", () => {
  const v = nameInput.value.trim() || me.name;
  nameInput.value = v;
  saveSolverName(v);
});

const mount = document.getElementById("mount");
const cardsByPuzzle = new Map();

function openSquares(grid) {
  let n = 0;
  grid.forEach(row => { for (const ch of row) if (ch !== ".") n++; });
  return n;
}

function render(puzzles) {
  if (!puzzles.length) {
    mount.innerHTML = `
      <div class="empty">
        Nothing in the database yet.
        <br>The new puzzle page opens with a sample mini already filled in &mdash;
        one click puts it in and you can start solving.
        <br><a class="cta" href="new.html">Add the sample puzzle</a>
      </div>`;
    return;
  }

  cardsByPuzzle.clear();
  const ul = document.createElement("ul");
  ul.className = "puzzles";
  mount.innerHTML = "";
  mount.appendChild(ul);

  puzzles.forEach(p => {
    const total = openSquares(p.grid);
    const cols = p.grid[0].length;

    const li = document.createElement("li");
    li.className = "puzzle";
    li.innerHTML = `
      <a class="card" href="rooms.html?id=${encodeURIComponent(p.id)}">
        <span class="thumb" style="grid-template-columns:repeat(${cols},1fr)"></span>
        <span>
          <span class="title"></span>
          <span class="meta"></span>
        </span>
        <span class="status">
          <span class="statusText">&mdash;</span>
          <span class="bar"><span class="fill"></span></span>
        </span>
      </a>`;

    li.querySelector(".title").textContent = p.title;
    li.querySelector(".meta").textContent =
      [p.grid.length + "\u00d7" + cols, p.difficulty, p.byline].filter(Boolean).join(" \u00b7 ");

    const thumb = li.querySelector(".thumb");
    p.grid.forEach(row => {
      for (const ch of row) {
        const i = document.createElement("i");
        if (ch === ".") i.className = "b";
        thumb.appendChild(i);
      }
    });

    ul.appendChild(li);

    cardsByPuzzle.set(p.id, {
      statusText: li.querySelector(".statusText"),
      fill: li.querySelector(".fill"),
      total
    });
  });

  applyRoomStats();
}

/* Rooms are counted per puzzle: how many are going, how many people are in
   them right now, and how far the furthest-along one has got. */
let latestRooms = {};

function applyRoomStats() {
  const per = new Map();
  Object.values(latestRooms).forEach(room => {
    if (!room || !room.meta || !room.meta.puzzleId) return;
    const s = per.get(room.meta.puzzleId) || { rooms: 0, live: 0, best: 0, solved: 0 };
    s.rooms++;
    s.live += Object.values(room.players || {})
      .filter(pl => pl && serverNow() - (pl.ts || 0) < 90000).length;
    s.best = Math.max(s.best, Object.keys(room.cells || {}).length);
    if (room.meta.solvedAt) s.solved++;
    per.set(room.meta.puzzleId, s);
  });

  cardsByPuzzle.forEach((card, id) => {
    const s = per.get(id);
    if (!s) {
      card.statusText.textContent = "No rooms yet";
      card.fill.style.width = "0%";
      return;
    }
    card.fill.style.width = Math.round((s.best / card.total) * 100) + "%";
    card.fill.style.background = s.solved && s.solved === s.rooms ? "#0a7d33" : "";
    const rooms = s.rooms + (s.rooms === 1 ? " room" : " rooms");
    if (s.live) {
      card.statusText.innerHTML =
        `<span class="live"><span class="dot"></span>${s.live} solving now</span><br>${rooms}`;
    } else if (s.solved) {
      card.statusText.innerHTML = `<span class="solved">Solved</span><br>${rooms}`;
    } else {
      card.statusText.textContent = rooms;
    }
  });
}

allRoomsRef().on("value", snap => {
  latestRooms = snap.val() || {};
  applyRoomStats();
}, err => console.error(err));

// The list is live too — add a puzzle in another tab and it shows up here.
allPuzzlesRef().on("value", snap => {
  const raw = snap.val() || {};
  const puzzles = Object.keys(raw)
    .map(id => normalizePuzzle(id, raw[id]))
    .filter(p => p && !gridProblem(p.grid))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0) || a.title.localeCompare(b.title));
  render(puzzles);
}, err => {
  console.error(err);
  mount.innerHTML = `<div class="empty">Can't reach the database. Check the config in
    firebase-config.js and your database rules.</div>`;
});
</script>
</body>
</html>
