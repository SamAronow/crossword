<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add queued puzzles</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212;--muted:#6b6b6b;--line:#dcdcdc;--bad:#c8102e;--good:#0a7d33;
    --font:"Libre Franklin","Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:var(--font);color:var(--ink);background:#fff;
    display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;
  }
  .box{max-width:460px;width:100%;text-align:center}
  a.back{
    display:inline-block;margin-bottom:26px;font-size:13px;font-weight:600;
    color:var(--muted);text-decoration:none;
  }
  a.back:hover{color:var(--ink)}
  button{
    font-family:var(--font);font-size:16px;font-weight:600;cursor:pointer;
    width:100%;padding:16px 20px;border-radius:28px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;
  }
  button:disabled{background:#fff;color:var(--muted);border-color:var(--line);cursor:default}
  ul{list-style:none;margin:20px 0 0;padding:0;text-align:left}
  li{
    display:flex;gap:10px;align-items:baseline;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;
  }
  li .mark{font-weight:700;width:1em;flex:none}
  li .mark.ok{color:var(--good)}
  li .mark.err{color:var(--bad)}
  li .what{flex:1;min-width:0}
  li .id{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:3px}
  li .src{font-size:11px;color:var(--muted);display:block;font-style:italic}
  li input.name{
    font-family:var(--font);font-size:14px;font-weight:600;color:var(--ink);
    width:100%;padding:5px 7px;background:#fff;
    border:1px solid var(--line);border-radius:4px;
  }
  li input.name:focus{outline:none;border-color:var(--ink);background:#fffdf0}
  li .why{color:var(--bad);display:block}
  p.said{font-size:13px;line-height:1.6;color:var(--muted);margin:20px 0 0;min-height:20px}
  p.said.ok{color:var(--good);font-weight:600}
  p.said.err{color:var(--bad);font-weight:600}
  p.said a{color:inherit}
</style>
</head>
<body>
<div class="box">
  <a class="back" href="index.html">&larr; Duo Crosswords</a>
  <button type="button" id="add" disabled>Loading&hellip;</button>
  <ul id="list"></ul>
  <p class="said" id="said"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="crossword-core.js"></script>
<script src="add-puzzles.js"></script>
<script>
const btn = document.getElementById("add");
const say = (msg, kind) => {
  const el = document.getElementById("said");
  el.innerHTML = msg;
  el.className = "said" + (kind ? " " + kind : "");
};

const missing = [];
if (typeof db === "undefined") missing.push("firebase-config.js");
if (typeof gridProblem === "undefined") missing.push("crossword-core.js");
if (typeof QUEUED === "undefined") missing.push("add-puzzles.js");

/* ---------- turning queued JSON into a puzzle record ---------- */

const slug = s => (s || "").toLowerCase().trim()
  .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// "black" / "#" / "" / "." all mean a black square; anything else is a letter.
function cellChar(cell) {
  const s = String(cell == null ? "" : cell).trim().toUpperCase();
  if (!s || s === "BLACK" || s === "#" || s === ".") return ".";
  return s[0];
}

// Clues arrive either as [{number, clue, answer}] or as { 1: "clue text" }.
function clueMap(list) {
  const out = {};
  if (Array.isArray(list)) list.forEach(c => { if (c && c.number != null) out[c.number] = c.clue || ""; });
  else if (list && typeof list === "object") Object.entries(list).forEach(([n, c]) => { out[n] = c; });
  return out;
}

function answerMap(list) {
  const out = {};
  if (Array.isArray(list)) list.forEach(c => {
    if (c && c.number != null && c.answer) out[c.number] = String(c.answer).toUpperCase();
  });
  return out;
}

/* Three grid shapes turn up:
     rows of strings      ["APES.", …]
     rows of arrays       [["A","P","E","S","black"], …]
     one flat array       ["A","P","E","S",".", …]  with size:{rows,cols}
*/
function gridRows(entry) {
  const g = entry.grid || [];
  if (Array.isArray(g[0])) return g.map(row => row.map(cellChar).join(""));

  const size = entry.size || {};
  const cols = Number(size.cols), rows = Number(size.rows);
  if (cols && rows && g.length === cols * rows) {
    const out = [];
    for (let r = 0; r < rows; r++) out.push(g.slice(r * cols, r * cols + cols).map(cellChar).join(""));
    return out;
  }
  return g.map(row => String(row).toUpperCase());
}

/* Clues arrive three ways too: {number, clue} objects, a plain map keyed by
   number, or strings with the number baked in ("1. One side of a showdown").
   In that last form the answers list runs parallel to the clue list. */
function clueMap(list) {
  const out = {};
  if (Array.isArray(list)) {
    list.forEach(c => {
      if (typeof c === "string") {
        const m = c.match(/^\s*(\d+)\s*[.:]?\s*([\s\S]*)$/);
        if (m) out[m[1]] = m[2].trim();
      } else if (c && c.number != null) {
        out[c.number] = c.clue || "";
      }
    });
  } else if (list && typeof list === "object") {
    Object.entries(list).forEach(([n, c]) => { out[n] = c; });
  }
  return out;
}

function answerMap(clueList, answerList) {
  const out = {};
  if (Array.isArray(clueList) && Array.isArray(answerList)) {
    clueList.forEach((c, i) => {
      const n = typeof c === "string" ? (c.match(/^\s*(\d+)/) || [])[1] : (c && c.number);
      if (n != null && answerList[i]) out[n] = String(answerList[i]).toUpperCase();
    });
  }
  if (Array.isArray(clueList)) clueList.forEach(c => {
    if (c && typeof c === "object" && c.number != null && c.answer) out[c.number] = String(c.answer).toUpperCase();
  });
  return out;
}

/* Circled/shaded squares — some themes are unreadable without them. */
function shadedKeys(entry, rows) {
  const marks = entry.circles || entry.shadecircles === true && entry.circles;
  if (!Array.isArray(marks) || !rows.length) return [];
  const cols = rows[0].length;
  const out = [];
  marks.forEach((v, i) => {
    if (!v) return;
    const r = Math.floor(i / cols), c = i % cols;
    if (rows[r] && rows[r][c] && rows[r][c] !== ".") out.push(r + "_" + c);
  });
  return out;
}

function convert(entry, i) {
  const rows = gridRows(entry);
  const clues = entry.clues || {};
  const answers = entry.answers || {};
  const sourceTitle = entry.title || "";
  return {
    sourceTitle,
    byline: entry.byline || entry.author || "",
    difficulty: entry.difficulty || entry.dow || "",
    grid: rows,
    clues: { across: clueMap(clues.across), down: clueMap(clues.down) },
    answers: {
      across: answerMap(clues.across, answers.across),
      down: answerMap(clues.down, answers.down)
    },
    shaded: shadedKeys(entry, rows),
    givenId: entry.id || ""
  };
}

/* ---------- checking one before it goes anywhere near the database ---------- */

function check(p) {
  if (!p.grid.length) return "no grid";
  const problem = gridProblem(p.grid);
  if (problem) return problem;

  const M = buildModel(p);
  const tag = e => e.num + (e.dir === "across" ? "A" : "D");

  const noClue = M.order.filter(e => !e.clue).map(tag);
  if (noClue.length) return "no clue for " + noClue.slice(0, 6).join(", ") +
    (noClue.length > 6 ? ` and ${noClue.length - 6} more` : "");

  // A clue numbered for an entry that doesn't exist means the grid and the
  // clue list disagree — usually a row transcribed wrong.
  const orphan = [];
  ["across", "down"].forEach(dir => {
    const nums = new Set(M.entries[dir].map(e => String(e.num)));
    Object.keys(p.clues[dir]).forEach(n => {
      if (!nums.has(String(n))) orphan.push(n + (dir === "across" ? "A" : "D"));
    });
  });
  if (orphan.length) return "clue " + orphan.slice(0, 6).join(", ") + " has no entry in the grid";

  // If answers came along, they have to match the letters in the grid.
  const wrong = M.order.filter(e => {
    const given = p.answers[e.dir][e.num];
    return given && given !== entryAnswer(e);
  }).map(e => `${tag(e)} says ${p.answers[e.dir][e.num]}, grid has ${entryAnswer(e)}`);
  if (wrong.length) return wrong[0] + (wrong.length > 1 ? ` (+${wrong.length - 1} more)` : "");

  return null;
}

/* ---------- page ---------- */

let rows = [];
let taken = new Set();

function nameField(row, i) {
  const input = document.createElement("input");
  input.className = "name";
  input.type = "text";
  input.value = row.name;
  input.setAttribute("aria-label", "Name for queued puzzle " + (i + 1));
  input.addEventListener("input", () => {
    row.name = input.value;
    row.id = slug(input.value) || row.fallbackId;
    row.el.querySelector(".id").textContent = row.id + " \u00b7 " +
      row.p.grid.length + "\u00d7" + row.p.grid[0].length +
      (taken.has(row.id) ? " \u00b7 replaces an existing puzzle" : "");
  });
  return input;
}

async function boot() {
  // Existing ids, so the default name is the first one not in use.
  try {
    const snap = await allPuzzlesRef().once("value");
    taken = new Set(Object.keys(snap.val() || {}));
  } catch (err) { console.error(err); }

  let n = 0;
  const nextName = () => {
    do { n++; } while (taken.has("puzzle-" + n) || rows.some(r => r.id === "puzzle-" + n));
    return "Puzzle " + n;
  };

  rows = QUEUED.map((entry, i) => {
    let p, why;
    try { p = convert(entry, i); why = check(p); }
    catch (err) { why = err.message; }
    const row = { p, why };
    if (p) {
      row.fallbackId = p.givenId || "puzzle-" + (i + 1);
      row.name = p.givenId || nextName();
      row.id = slug(row.name) || row.fallbackId;
    }
    return row;
  });

  const list = document.getElementById("list");
  rows.forEach((row, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="mark ${row.why ? "err" : "ok"}">${row.why ? "\u2717" : "\u2713"}</span>
      <span class="what">
        <span class="nameslot"></span>
        <span class="id"></span>
        ${row.p && row.p.sourceTitle ? `<span class="src">in the file: ${row.p.sourceTitle}</span>` : ""}
        ${row.why ? `<span class="why">${row.why}</span>` : ""}
      </span>`;
    row.el = li;
    if (row.p) {
      li.querySelector(".nameslot").appendChild(nameField(row, i));
      li.querySelector(".id").textContent = row.id + " \u00b7 " +
        row.p.grid.length + "\u00d7" + row.p.grid[0].length +
        (taken.has(row.id) ? " \u00b7 replaces an existing puzzle" : "");
    } else {
      li.querySelector(".nameslot").textContent = `entry ${i + 1}`;
    }
    list.appendChild(li);
  });

  const good = rows.filter(r => !r.why);
  if (!good.length) {
    btn.textContent = "Nothing usable";
    return;
  }
  btn.disabled = false;
  btn.textContent = `Add ${good.length} queued puzzle${good.length === 1 ? "" : "s"}`;
  if (good.length < rows.length) say(`${rows.length - good.length} won't be added — see above.`);
  btn.addEventListener("click", run);
}

if (missing.length) {
  btn.textContent = "Files missing";
  say("Couldn't load <b>" + missing.join("</b>, <b>") + "</b> — same folder, exact spelling.", "err");
} else if (!QUEUED.length) {
  btn.textContent = "Nothing queued";
  say("Paste puzzle JSON into the QUEUED array in add-puzzles.js.");
} else {
  boot();
}

async function run() {
  btn.disabled = true;
  say("Adding\u2026");
  const done = [];
  try {
    for (const row of rows.filter(r => !r.why)) {
      const id = row.id || row.fallbackId;
      const was = await puzzleRef(id).once("value");
      const record = {
        title: row.name || id,
        byline: row.p.byline,
        difficulty: row.p.difficulty,
        grid: row.p.grid.join("\n"),
        clues: row.p.clues,
        createdAt: (was.exists() && was.val().createdAt) || firebase.database.ServerValue.TIMESTAMP
      };
      if (row.p.shaded.length) record.shaded = row.p.shaded.join(" ");
      await puzzleRef(id).set(record);
      done.push({ id, title: record.title });
    }
  } catch (err) {
    console.error(err);
    say((done.length ? done.length + " added, then stopped: " : "") + err.message, "err");
    btn.disabled = false;
    return;
  }
  btn.textContent = "Done";
  say(`Added ${done.map(p =>
    `<a href="rooms.html?id=${encodeURIComponent(p.id)}">${p.title}</a>`).join(", ")}.
    Clear them out of add-puzzles.js when you like.`, "ok");
}
</script>
</body>
</html>
